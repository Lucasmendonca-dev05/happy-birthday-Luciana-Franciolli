<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luciana Franciolli · 17 de outubro</title>
  <meta name="description" content="Fotos do aniversário de Luciana Franciolli. Em breve.">
  <meta name="theme-color" content="#4a0d1c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="soon" class="soon">
    <p class="eyebrow">Aniversário</p>
    <h1>Luciana<br><em>Franciolli</em></h1>
    <div class="rule"></div>
    <p class="date">17 de outubro de 2026</p>
    <div id="countdown" class="countdown" aria-live="polite"></div>
    <p class="msg">As fotos estarão aqui em breve.</p>
  </main>

  <section id="gallery" class="gallery" hidden>
    <header class="g-head">
      <div>
        <p class="eyebrow">17 · 10 · 2026</p>
        <h2>Luciana <em>Franciolli</em></h2>
      </div>
      <a id="zip" class="btn" hidden download>Baixar todas</a>
    </header>
    <div id="grid" class="grid"></div>
    <footer class="credit">Fotografia · <span id="credit">seu nome aqui</span></footer>
  </section>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" aria-label="Fechar">×</button>
    <button class="lb-nav prev" aria-label="Anterior">‹</button>
    <img id="lb-img" alt="">
    <button class="lb-nav next" aria-label="Próxima">›</button>
    <a id="lb-dl" class="btn" download>Baixar foto</a>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
